{% extends 'base.html' %}{% block page_title %}Новый объект{% endblock %}{% block title %}Добавление сооружения{% endblock %}{% block content %}<section class="panel form-panel"><div class="panel-head"><div><span class="section-kicker">DATA COLLECTION</span><h2>Новый объект мониторинга</h2><p class="muted">Введите паспортные данные и координаты. Индекс автоматически определит состояние и риск.</p></div></div><form class="form-grid" method="post"><label>Название<input name="name" required placeholder="Например: Мост №011"></label><label>Расположение<input name="location" required placeholder="Москва, ..."></label><label>Год строительства<input type="number" name="year" value="2020" required></label><label>Дата осмотра<input type="date" name="date" value="{{now[:10]}}" required></label><label>Тип<select name="bridge_type"><option>Автодорожный мост</option><option>Путепровод</option><option>Пешеходный мост</option><option>Железнодорожный мост</option></select></label><label>Материал<input name="material" value="Железобетон"></label><label>Длина, м<input type="number" step="0.1" name="length" value="100"></label><label>Ширина, м<input type="number" step="0.1" name="width" value="18"></label><label>Полосы движения<input type="number" name="lanes" value="4"></label><label>Индекс состояния<input type="number" min="0" max="100" name="score" value="80" required></label><label>Широта<input type="number" step="0.000001" name="latitude" value="55.7558"></label><label>Долгота<input type="number" step="0.000001" name="longitude" value="37.6173"></label><label class="wide">Описание<textarea name="description" placeholder="Краткая характеристика сооружения..."></textarea></label><div class="wide"><button class="button" type="submit">Создать объект →</button><a class="button ghost" href="/bridges">Отмена</a></div></form></section>{% endblock %}
